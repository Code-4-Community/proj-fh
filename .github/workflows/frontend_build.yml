name: Frontend build

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest
    container: node:24-alpine

    steps:
    - uses: actions/checkout@v4

    - name: Enable Corepack (helps to pin yarn version)
      run: corepack enable

    - name: Install Dependencies
      run: yarn install

    - name: Build frontend
      run: npx nx build frontend
